services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  python-worker:
    build:
      # Build context relative to current directory
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env.dev
    environment:
      # Fallback default prevents warning if RABBITMQ_URL is not set
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@localhost:5672}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      # Dynamic mapping from current folder to container working dir
      - .:/app
    # Command to run the Python service entrypoint
    command: python -m src.main
    networks:
      - app-network

volumes:
  pgdata_dev:

networks:
  app-network:
    driver: bridge