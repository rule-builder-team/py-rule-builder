services:
  postgres:
    image: postgres:18.4

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rule_builder}
      POSTGRES_USER: ${POSTGRES_USER:-rule_builder_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rule_builder_dev_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rule_builder_user} -d ${POSTGRES_DB:-rule_builder}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data: